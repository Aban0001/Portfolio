<svg viewBox="0 0 900 200" width="100%" height="200"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Connecting line -->
  <line x1="120" y1="100" x2="780" y2="100"
        stroke="#F2B705" stroke-width="3" opacity="0.6"/>

  <!-- Brain (Idea) -->
  <path d="M120 70
           c-20 0-30 15-30 30
           0 15 10 30 30 30
           h20
           c15 0 25-10 25-25
           0-10-5-18-15-20
           5-10-5-15-15-15
           z"
        fill="none" stroke="#F2B705" stroke-width="3"/>

  <!-- Pencil (Design) -->
  <g transform="translate(280 75)">
    <rect x="0" y="0" width="80" height="10"
          fill="none" stroke="#F2B705" stroke-width="3"/>
    <polygon points="80,0 95,5 80,10"
             fill="#F2B705"/>
  </g>

  <!-- Screen (UI) -->
  <g transform="translate(470 60)">
    <rect x="0" y="0" width="120" height="70" rx="6"
          fill="none" stroke="#F2B705" stroke-width="3"/>
    <line x1="40" y1="75" x2="80" y2="75"
          stroke="#F2B705" stroke-width="3"/>
  </g>

  <!-- Star (Result) -->
  <polygon points="760,70 770,95 795,95
                   775,110 785,135
                   760,120 735,135
                   745,110 725,95
                   750,95"
           fill="none" stroke="#F2B705" stroke-width="3"/>

</svg>
